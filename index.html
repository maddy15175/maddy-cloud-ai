<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>maddy-cloud-ai</title>
  <style>html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;font-family:system-ui,Segoe UI,Roboto,Arial;background:#fff;color:#111}#card{width:760px;max-width:96%;padding:20px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,0.06)}textarea{width:100%;box-sizing:border-box;padding:10px;font-size:14px;border:1px solid #ddd;border-radius:6px}#controls{display:flex;gap:8px;margin-top:8px}#model{flex:1;padding:8px;border:1px solid #ddd;border-radius:6px}button{padding:8px 12px;border-radius:6px;border:0;background:#111;color:#fff;cursor:pointer}pre{white-space:pre-wrap;background:#f7f7f8;padding:12px;border-radius:6px;margin-top:12px;max-height:340px;overflow:auto;border:1px solid #eee}</style>
</head>
<body>
  <div id="card">
    <textarea id="input" rows="6" placeholder="Enter a prompt for the Hugging Face model..."></textarea>
    <div id="controls">
      <input id="model" placeholder="Model (optional; e.g. gpt2 or google/flan-t5-base). Default: gpt2" />
      <button id="send">Send</button>
    </div>
    <pre id="output">Result will appear here</pre>
  </div>

  <script>
    async function send() {
      const input = document.getElementById('input').value;
      const model = document.getElementById('model').value || 'gpt2';
      const output = document.getElementById('output');
      if (!input) { output.textContent = 'Please enter a prompt.'; return; }
      output.textContent = 'Loading...';
      try {
        const res = await fetch('/api/hf-proxy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input, model })
        });
        const data = await res.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = 'Request failed: ' + err.message;
      }
    }
    document.getElementById('send').addEventListener('click', send);
    // allow Cmd/Ctrl+Enter to send
    document.getElementById('input').addEventListener('keydown', (e)=>{ if ((e.ctrlKey||e.metaKey) && e.key==='Enter') send(); });
  </script>
</body>
</html>
